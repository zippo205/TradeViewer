# Usage (from the repository root):
#   docker compose -f deploy/docker-compose.yml up -d --build
# With EWTS's scenario folder (scenario viewer and own analysis, SC1 to SC13):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.scenarios.yml up -d --build
#
# Host folders (adjust to your machine; they must exist before the first start):
#   MARKETDATA_PATH   the Downloader's output root, mounted read-only (the Downloader's compose file
#                     calls it OUTPUT_PATH). Without it the service stops at startup.
#   APPDATA_PATH      TradeViewer's own data: marketdata.db, workspace.db, backups. On an SSD, not
#                     on the SD card of the Pi.
#   SCENARIOS_PATH    EWTS's scenario folder (only with docker-compose.scenarios.yml); writable,
#                     TradeViewer writes its *.expert.json files there.
#   APP_UID/APP_GID   user the container runs as; must be able to write APPDATA_PATH and
#                     SCENARIOS_PATH (default 1000, the first Linux user, also on Raspberry Pi OS).
#                     The files in the scenario folder then belong to that user, so EWTS can read
#                     them. Check yours with: id -u; id -g
#   TRADEVIEWER_PORT  host port of the website (default 8080; the Downloader uses 8081)
#
# Logs: docker logs tradeviewer (console, UTC). JSON logs instead:
#   environment: Logging__Console__FormatterName=json

# Own project name: without it Docker uses the folder name (deploy), which the Downloader's compose
# file shares, and each project then reports the other's container as an orphan.
name: tradeviewer

services:
  tradeviewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tradeviewer:latest
    container_name: tradeviewer
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    # NF9: TradeViewer runs within 512 MB
    mem_limit: 512m
    # Docker keeps container logs forever by default: keep 3 x 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${TRADEVIEWER_PORT:-8080}:8080"
    volumes:
      # Long syntax with create_host_path: false: a missing host folder is an error, not a new empty
      # folder owned by root.
      - type: bind
        source: ${MARKETDATA_PATH:-../data/marketdata}
        target: /data/marketdata
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${APPDATA_PATH:-../data/app}
        target: /data/app
        bind:
          create_host_path: false
